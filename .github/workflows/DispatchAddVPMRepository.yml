name: Dispatch-Add-VPM-Repository
on:
    release:
      types: [published]
    workflow_dispatch:
      inputs:
        tag_name:
          description: 'Tag name for the package (e.g., v1.0.0)'
          required: true
          type: string

jobs:
  SendVPMRepository:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="${{ github.event.release.tag_name }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.VPM_REPO_TOKEN }}
          repository: your-username/repositoryname
          event-type: add_new_version
          client-payload: '{"repository": "repositoryname", "tag": "${{ steps.vars.outputs.tag_name }}"}'
